<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKIM - Anuncios</title>
<style>
body{margin:0;font-family:Arial;background:#0a0a0f;color:#fff;text-align:center}
header{padding:20px;background:linear-gradient(90deg,#ff0055,#7b00ff)}
.logo{font-size:28px;font-weight:900;letter-spacing:2px}
.card{background:#15151f;margin:15px;border-radius:16px;padding:18px;text-align:left}
button{width:100%;padding:13px;margin:6px 0;border:none;border-radius:12px;font-weight:800;cursor:pointer}
.btn-pink{background:#ff0055;color:#fff}
.btn-dark{background:#2a2a3a;color:#fff}
.btn-gold{background:#ffd700;color:#000}
.btn-green{background:#00c853;color:#fff}
.hidden{display:none !important}
.anuncioBox{background:#222231;padding:16px;margin:12px 0;border-radius:14px;border:1px solid #444;text-align:left}
.anuncioBox.aceptado{border:2px solid #00ff88;background:#002a12}
.anuncioBox h3{margin:5px 0;font-size:18px;line-height:1.3}
.anuncioBox p{line-height:1.5}
.badge{display:inline-block;background:#00c853;color:#fff;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:900;margin:5px 0}
</style>
</head>
<body>
<header>
<div class="logo">📢 AKIM ANUNCIOS 📢</div>
<div>Todo lo nuevo de AKIM aquí</div>
</header>

<!-- CARGANDO - PARA QUE NO SE VEA NEGRO -->
<div id="cargandoBox" class="card">
<h2>⏳ Cargando anuncios...</h2>
<p style="color:#aaa;font-size:14px">Espera un segundito.</p>
</div>

<div id="lista" class="card hidden">
<h2>📢 Últimos Anuncios</h2>
<p style="color:#aaa;font-size:14px">Cuando en correo.html aceptan a alguien, sale aquí solo, con su nombre y su rol.</p>
<div id="listaAnuncios"></div>
<button class="btn-pink" onclick="location.href='postulaciones.html'">📋 Yo también quiero postularme</button>
<button class="btn-dark" onclick="location.href='tienda.html'">🛒 Ir a la Tienda</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCx4pzzblnDbcK1aXnoIj7AIgMOpge_0ao",
  authDomain: "akim-mods.firebaseapp.com",
  projectId: "akim-mods",
  storageBucket: "akim-mods.firebasestorage.app",
  messagingSenderId: "1038400568277",
  appId: "1:1038400568277:web:103029336774c075a29b5c",
  measurementId: "G-5Y8JCL7G79"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// PARA QUE DIGA BIEN EL ROL - IGUAL QUE EN CORREO.HTML
function nombreBonitoRol(rol){
  if(rol === "Reseñas") return "Reseñero / Encargado de Reseñas";
  if(rol === "Moderador") return "Moderador";
  if(rol === "Soporte") return "Soporte";
  return rol || "";
}

async function cargarAnuncios(){
  try{
    // SIN orderBy - ESO LO DEJABA EN NEGRO, ORDENAMOS AQUÍ
    let snap = await db.collection('anuncios').get();
    document.getElementById('cargandoBox').classList.add('hidden');
    document.getElementById('lista').classList.remove('hidden');
    if(snap.empty){
      document.getElementById('listaAnuncios').innerHTML = "<p style='color:#aaa'>Aún no hay anuncios. Cuando aceptes a alguien en correo.html, va a salir aquí solo.</p>";
      return;
    }
    let docs = snap.docs.sort((a,b)=> (b.data().fecha||0) - (a.data().fecha||0));
    let html = "";
    docs.forEach(doc=>{
      let d = doc.data();
      let esAceptado = d.tipo === "aceptado";
      let rolBonito = nombreBonitoRol(d.rol);
      html += `<div class="anuncioBox ${esAceptado ? "aceptado" : ""}">
      ${esAceptado ? '<span class="badge">✅ ACEPTADO</span>' : ''}
      <h3>${d.titulo || "📢 Anuncio"}</h3>
      <p>${d.mensaje || ""}</p>
      ${d.nombre ? "<p><b>👤 " + d.nombre + "</b>" + (rolBonito ? " - 🛡️ " + rolBonito : "") + "</p>" : ""}
      <p style="font-size:12px;color:#aaa">${d.fecha ? new Date(d.fecha).toLocaleString() : ""}</p>
      </div>`;
    });
    document.getElementById('listaAnuncios').innerHTML = html;
  }catch(e){
    document.getElementById('cargandoBox').innerHTML = "Error cargando anuncios: " + e.message;
  }
}
cargarAnuncios();
</script>
</body>
</html>
