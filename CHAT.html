<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKIM MODS - Chat Global | Free Fire</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&family=Inter:wght@600;800&display=swap');
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',Arial;background:#0b0b12;color:#fff;height:100vh;display:flex;flex-direction:column}
.topbar{background:#000;border-bottom:3px solid #ff6b00;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.topbar .logo{font-family:'Orbitron';font-weight:900;font-size:18px}
.topbar .logo span{color:#ff6b00}
.hud{display:flex;gap:6px}
.hud div{background:#1c1c26;border:1px solid #ff6b00;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:800}
.hud b{color:#ffd700}
.vipBar{background:linear-gradient(135deg,#1a1a26,#2a1a00);border-bottom:2px solid #ffd700;padding:10px 12px;text-align:center}
.vipBar p{margin:2px 0;font-size:13px;color:#ddd}
.vipTime{font-size:15px;font-weight:900;color:#00ff88}
.vipNo{color:#ff4d4d;font-weight:900}
.online{background:#1c1c26;padding:8px 12px;text-align:center;font-size:13px;font-weight:800;border-bottom:1px solid #333}
.online b{color:#00ff88}
#chatBox{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;background:#0f0f18}
.msg{background:#1f1f2e;padding:10px 12px;border-radius:14px;border-left:4px solid #ff6b00;max-width:85%;word-break:break-word}
.msg.mio{background:#2a1a00;border-left-color:#ffd700;align-self:flex-end}
.msg .nombre{font-size:12px;font-weight:900;color:#ffd700}
.msg .nombre span{color:#fff;background:#ff6b00;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:5px}
.msg .texto{font-size:14px;margin:4px 0 0}
.msg .hora{font-size:10px;color:#888;text-align:right;margin-top:4px}
.inputBar{background:#000;padding:10px;display:flex;gap:8px;border-top:2px solid #ff6b00}
.inputBar input{flex:1;padding:13px;border-radius:20px;border:1px solid #444;background:#1c1c26;color:#fff;font-size:14px;outline:none}
.inputBar button{background:linear-gradient(90deg,#ff6b00,#ff2e00);color:#fff;border:none;padding:12px 18px;border-radius:20px;font-family:'Orbitron';font-weight:900;cursor:pointer}
.btns{display:flex;gap:8px;padding:10px;background:#111}
.btns button{flex:1;padding:10px;background:#222;color:#fff;border:1px solid #555;font-weight:800;cursor:pointer;border-radius:10px}
</style>
</head>
<body>

<div class="topbar">
<div class="logo">AKIM<span> MODS</span> - CHAT GLOBAL</div>
<div class="hud">
<div>💎 <b id="diamantesTop">0</b></div>
<div>👑 <b id="vipTop">NO VIP</b></div>
</div>
</div>

<div class="vipBar">
<p><b>Correo:</b> <span id="userEmail">---</span> | <b>VIP:</b> <span id="userVip" class="vipNo">NO VIP</span></p>
<p class="vipTime" id="vipTiempo">Cargando...</p>
<p id="msgNoLogin" style="color:#ffcc00"></p>
</div>

<div class="online">🟢 EN LÍNEA: <b id="onlineCount">1</b> jugadores en el chat • Todos ven lo que escribes</div>

<div id="chatBox">
<div style="text-align:center;color:#888;font-size:13px;padding:20px">🔥 Bienvenido al Chat Global de AKIM MODS<br>Escribe algo y todos lo van a ver en vivo</div>
</div>

<div class="inputBar">
<input id="inputMsg" type="text" placeholder="Escribe tu mensaje... 🔥" maxlength="200">
<button onclick="enviarMensaje()">ENVIAR ➤</button>
</div>

<div class="btns">
<button onclick="window.location.href='tienda.html'">🛒 Tienda</button>
<button onclick="window.location.href='TXT.html'">📂 Texturas</button>
<button onclick="window.location.href='PAREDES.html'">🧱 Paredes</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCx4pzzblnDbcK1aXnoIj7AIgMOpge_0ao",
  authDomain: "akim-mods.firebaseapp.com",
  projectId: "akim-mods",
  storageBucket: "akim-mods.firebasestorage.app",
  messagingSenderId: "1038400568277",
  appId: "1:1038400568277:web:103029336774c075a29b5c",
  measurementId: "G-5Y8JCL7G79"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let userActual = null;
let datos = {diamantes:0, vip:false, vipHasta:0, admin:false};
let miNombre = "Invitado";

function esVipActivo(){
  if(datos.vip && datos.vipHasta === 0) return true;
  if(!datos.vip) return false;
  if(datos.vipHasta && Date.now() > datos.vipHasta){ datos.vip = false; datos.vipHasta = 0; return false; }
  return true;
}
function actualizarUI(){
  let activo = esVipActivo();
  document.getElementById('diamantesTop').innerText = datos.diamantes || 0;
  document.getElementById('vipTop').innerText = activo ? "VIP ✅" : "NO VIP";
  document.getElementById('userVip').innerText = activo ? "✅ VIP ACTIVO" : "NO VIP";
  document.getElementById('userVip').className = activo ? "vipTime" : "vipNo";
  if(activo && datos.vipHasta === 0){
    document.getElementById('vipTiempo').innerText = "👑 VIP PERMANENTE";
  } else if(activo && datos.vipHasta){
    let falta = datos.vipHasta - Date.now();
    let dias = Math.floor(falta / (24*60*60*1000));
    let horas = Math.floor((falta % (24*60*60*1000)) / (60*60*1000));
    let minutos = Math.floor((falta % (60*60*1000)) / (60*1000));
    if(dias > 0) document.getElementById('vipTiempo').innerText = "⏳ Te quedan " + dias + "d " + horas + "h " + minutos + "m de VIP";
    else document.getElementById('vipTiempo').innerText = "⏳ Te quedan " + horas + "h " + minutos + "m de VIP";
  } else {
    document.getElementById('vipTiempo').innerText = "Sin VIP - Ve a la tienda a conseguirlo";
  }
}

function formatearHora(ts){
  if(!ts) return "";
  let d = ts.toDate ? ts.toDate() : new Date(ts);
  let h = d.getHours().toString().padStart(2,'0');
  let m = d.getMinutes().toString().padStart(2,'0');
  return h + ":" + m;
}

function mostrarMensaje(doc){
  let data = doc.data();
  let box = document.getElementById('chatBox');
  // Evitar duplicados
  if(document.getElementById('msg-'+doc.id)) return;
  let div = document.createElement('div');
  div.id = 'msg-'+doc.id;
  let esMio = userActual && data.uid === userActual.uid;
  div.className = 'msg' + (esMio ? ' mio' : '');
  let badge = "";
  if(data.vip) badge = "<span>VIP 👑</span>";
  if(data.admin) badge = "<span>ADMIN 👑</span>";
  div.innerHTML = '<div class="nombre">' + (data.nombre || "Jugador") + ' ' + badge + '</div><div class="texto"></div><div class="hora">' + formatearHora(data.fecha) + '</div>';
  div.querySelector('.texto').textContent = data.texto;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function enviarMensaje(){
  let input = document.getElementById('inputMsg');
  let texto = input.value.trim();
  if(!texto){
    alert("Escribe algo primero");
    return;
  }
  if(!userActual){
    alert("⚠️ Tienes que iniciar sesión en la tienda con el mismo correo para chatear.");
    window.location.href = 'tienda.html';
    return;
  }
  db.collection('chat_global').add({
    texto: texto,
    nombre: miNombre,
    uid: userActual.uid,
    vip: esVipActivo(),
    admin: datos.admin || false,
    fecha: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    input.value = "";
  }).catch((e)=>{
    alert("Error al enviar: " + e.message);
  });
}

document.getElementById('inputMsg').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ enviarMensaje(); }
});

auth.onAuthStateChanged(async (user)=>{
  if(user){
    userActual = user;
    miNombre = user.email.split('@')[0];
    document.getElementById('userEmail').innerText = user.email;
    document.getElementById('msgNoLogin').innerText = "";
    const doc = await db.collection('usuarios').doc(user.uid).get();
    if(doc.exists){
      datos = doc.data();
      if(datos.vipHasta===undefined) datos.vipHasta=0;
      if(datos.diamantes===undefined) datos.diamantes=0;
    }
    actualizarUI();
  } else {
    document.getElementById('userEmail').innerText = "No has iniciado sesión";
    document.getElementById('msgNoLogin').innerText = "⚠️ Inicia sesión en la tienda con el mismo correo para chatear y ver tu VIP.";
    actualizarUI();
  }
  // Escuchar mensajes en vivo
  db.collection('chat_global').orderBy('fecha','asc').limitToLast(100).onSnapshot((snap)=>{
    snap.docChanges().forEach((change)=>{
      if(change.type === 'added'){
        mostrarMensaje(change.doc);
      }
    });
  });
});
setInterval(()=>{ if(userActual){ actualizarUI(); } }, 30000);
</script>
</body>
  </html>
