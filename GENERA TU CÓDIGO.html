let codigoActual="";
function elegirAlAzar(disponibles){let total=0;disponibles.forEach(c=>total+=c.peso);let r=Math.random()*total;for(let c of disponibles){if(r<c.peso) return c;r-=c.peso;}return disponibles[disponibles.length-1];}
async function generar(){let user=auth.currentUser;if(!user){document.getElementById('codigoTexto').innerText="Inicia sesión primero";document.getElementById('premioTexto').innerText="Entra a la Principal e inicia sesión";return;}let ref=db.collection('usuarios').doc(user.uid);let doc=await ref.get();let data=doc.exists?doc.data():{};let generados=data.codigosGenerados||[];let usados=data.codigosUsados||[];if(generados.length>=TODOS.length){document.getElementById('textoEstado').innerText="Códigos promocionales completados, ya no hay más códigos promocionales.";document.getElementById('codigoTexto').innerText="✅ COMPLETADO";document.getElementById('premioTexto').innerText="Ya te salieron todos los códigos";document.getElementById('btnCopiar').style.display="none";return;}let pendientes=generados.filter(id=>!usados.includes(id));let elegido=null;if(pendientes.length>0){let ultimoId=pendientes[pendientes.length-1];elegido=TODOS.find(c=>c.id===ultimoId);document.getElementById('textoEstado').innerText="Este es tu código pendiente. Canjéalo primero.";}else{let disponibles=TODOS.filter(c=>!generados.includes(c.id));elegido=elegirAlAzar(disponibles);await ref.set({codigosGenerados:firebase.firestore.FieldValue.arrayUnion(elegido.id)},{merge:true});document.getElementById('textoEstado').innerText="¡Te salió un código! Cópialo y canjéalo.";}codigoActual=elegido.texto;document.getElementById('codigoTexto').innerText=elegido.texto;document.getElementById('premioTexto').innerText="Premio: "+elegido.premio;}
async function copiarCodigo(){if(!codigoActual){return;}try{await navigator.clipboard.writeText(codigoActual);alert("✅ Código copiado: "+codigoActual);}catch(e){let ta=document.createElement("textarea");ta.value=codigoActual;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();alert("✅ Código copiado: "+codigoActual);}}
auth.onAuthStateChanged(async(user)=>{if(!user){document.getElementById('codigoTexto').innerText="Inicia sesión";document.getElementById('premioTexto').innerText="Ve a la Principal e inicia sesión";return;}await generar();});
