<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKIM MODS 👑</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0f;color:#fff;min-height:100vh;padding:15px}
header{text-align:center;padding:20px 0}
header h1{font-size:32px;color:#ffd700}
header p{color:#aaa;margin-top:5px}
.card{background:#1a1a25;border-radius:15px;padding:20px;margin:15px 0;border:1px solid #333}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-size:15px}
button{width:100%;padding:12px;margin:5px 0;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px}
.btn-gold{background:#ffd700;color:#000}
.btn-blue{background:#2563eb;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn-gray{background:#333;color:#fff}
.user-card{background:#222;border:1px solid #333;border-radius:12px;padding:15px;margin:10px 0}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold;margin:2px}
.badge-vip{background:#ffd700;color:#000}
.badge-baneado{background:#dc2626;color:#fff}
.badge-normal{background:#444;color:#fff}
.badge-admin{background:#a855f7;color:#fff}
.stats{display:flex;gap:10px;text-align:center}
.stats div{flex:1;background:#222;padding:15px;border-radius:12px}
.stats b{font-size:22px;display:block;color:#ffd700}
.hidden{display:none}
.flex{display:flex;gap:8px}
.flex button{flex:1}
small{color:#999}
</style>
</head>
<body>

<header>
<h1>AKIM MODS 👑</h1>
<p>Mods Premium • VIP • Diamantes</p>
</header>

<div id="authBox" class="card">
<h2>🔐 Iniciar Sesión / Registrarse</h2>
<input type="email" id="email" placeholder="Tu correo">
<input type="password" id="password" placeholder="Tu contraseña">
<input type="text" id="nombreReg" placeholder="Tu nombre (solo para registrarse)">
<button class="btn-blue" onclick="login()">Entrar</button>
<button class="btn-gray" onclick="registrar()">Crear Cuenta Nueva</button>
</div>

<div id="userBox" class="card hidden">
<h2 id="saludo">Hola 👋</h2>
<p id="miInfo"></p>
<p>💎 Diamantes: <b id="misDiamantes">0</b></p>
<p>Estado: <span id="miEstado"></span></p>
<button class="btn-gold" onclick="verTodo()">🔄 Actualizar</button>
<button class="btn-red" onclick="salir()">Salir</button>
<div id="zonaDescarga" style="margin-top:15px"></div>
</div>

<div id="adminBox" class="card hidden">
<h2>🛡️ Panel Moderador</h2>
<div class="stats">
<div><b id="totalUsuarios">0</b><small>Usuarios</small></div>
<div><b id="totalVip">0</b><small>Total VIP</small></div>
<div><b id="totalBaneados">0</b><small>Baneados</small></div>
</div>
<button class="btn-blue" onclick="cargarUsuarios()">🔄 Cargar Usuarios</button>
<div id="listaUsuarios"></div>
</div>

<div class="card">
<h2>🎮 Mods Disponibles</h2>
<div id="listaMods"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
// ===== CONFIG - PEGA TU CONFIG VIEJA AQUI, SOLO ESTA PARTE =====
const firebaseConfig = {
  apiKey: "TU_APIKEY_VIEJA",
  authDomain: "akim-mods.firebaseapp.com",
  projectId: "akim-mods",
  storageBucket: "akim-mods.appspot.com",
  messagingSenderId: "TU_ID_VIEJO",
  appId: "TU_APPID_VIEJO"
};
// ===== NO TOCAR ABAJO - AQUI YA QUEDO ARREGLADO EL ERROR DE AUTH =====
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let userActual = null;
let datosActual = null;

async function registrar(){
  let email = document.getElementById('email').value;
  let pass = document.getElementById('password').value;
  let nombre = document.getElementById('nombreReg').value || email.split('@')[0];
  if(!email || !pass) return alert("Pon correo y contraseña");
  try{
    let cred = await auth.createUserWithEmailAndPassword(email, pass);
    await db.collection('usuarios').doc(cred.user.uid).set({nombre:nombre,email:email,vip:false,vipHasta:0,admin:false,baneado:false,diamantes:0,fecha:Date.now()});
    alert("Cuenta creada ✅");
  }catch(e){ alert(e.message); }
}
async function login(){
  let email = document.getElementById('email').value;
  let pass = document.getElementById('password').value;
  try{ await auth.signInWithEmailAndPassword(email, pass); }catch(e){ alert(e.message); }
}
async function salir(){ await auth.signOut(); location.reload(); }
function esVipActivo(){
  if(!datosActual) return false;
  if(datosActual.baneado) return false;
  if(!datosActual.vip) return false;
  if(datosActual.vipHasta && datosActual.vipHasta !== 0 && Date.now() > datosActual.vipHasta) return false;
  return true;
}
function actualizarUI(){
  if(!datosActual) return;
  document.getElementById('misDiamantes').textContent = datosActual.diamantes || 0;
  document.getElementById('saludo').textContent = "Hola " + (datosActual.nombre || "👋");
  let estado = "";
  if(datosActual.baneado) estado = "🚫 BANEADO";
  else if(esVipActivo()) estado = "👑 VIP";
  else estado = "Normal";
  document.getElementById('miEstado').textContent = estado;
  document.getElementById('miInfo').textContent = datosActual.email;
  let zona = document.getElementById('zonaDescarga');
  if(datosActual.baneado){ zona.innerHTML = "<p style='color:red;font-weight:bold'>🚫 Estás baneado, no puedes descargar.</p>"; }
  else if(esVipActivo()){ zona.innerHTML = "<h3>👑 Descarga VIP Directa</h3><button class='btn-gold' onclick='descargarVip()'>⬇️ Descargar Sin Anuncios</button>"; }
  else { zona.innerHTML = "<h3>Descarga Gratis</h3><p>Tienes que ver un anuncio para descargar</p><button class='btn-blue' onclick='descargarGratis()'>⬇️ Descargar Con Acortador</button><br><br><button class='btn-gold' onclick='alert(\"Pide VIP al admin para descarga directa\")'>👑 Quiero ser VIP</button>"; }
  if(datosActual.admin){ document.getElementById('adminBox').classList.remove('hidden'); cargarUsuarios(); }
}
function descargarVip(){ alert("Descargando VIP 👑 - Link directo"); }
function descargarGratis(){ alert("Te lleva al acortador..."); window.open("https://tu-acortador.com","_blank"); }
async function cargarUsuarios(){
  try{
    let snap = await db.collection('usuarios').get();
    let lista = document.getElementById('listaUsuarios');
    lista.innerHTML = "";
    let totalVip = 0, totalBaneados = 0, total = 0;
    snap.forEach(doc=>{
      let u = doc.data(); let id = doc.id; total++;
      if(u.vip && !u.baneado) totalVip++;
      if(u.baneado) totalBaneados++;
      let estadoBadge = "";
      if(u.baneado) estadoBadge = "<span class='badge badge-baneado'>🚫 BANEADO</span>";
      else if(u.vip) estadoBadge = "<span class='badge badge-vip'>👑 VIP</span>";
      else estadoBadge = "<span class='badge badge-normal'>Normal</span>";
      if(u.admin) estadoBadge += "<span class='badge badge-admin'>ADMIN</span>";
      lista.innerHTML += `<div class="user-card"><b>${u.nombre || "Sin nombre"}</b><br><small>${u.email || ""}</small><br>${estadoBadge}<br>💎 Diamantes: <b>${u.diamantes || 0}</b><br><br><div class="flex"><button class="btn-gold" onclick="darVip('${id}')">Dar VIP</button><button class="btn-gray" onclick="quitarVip('${id}')">Quitar VIP</button></div><div class="flex"><button class="btn-green" onclick="darDiamantes('${id}')">+100 💎</button><button class="btn-red" onclick="banear('${id}', ${u.baneado ? true : false})">${u.baneado ? "Desbanear ✅" : "Banear 🚫"}</button></div><div class="flex"><button class="btn-blue" onclick="hacerAdmin('${id}', ${u.admin ? true : false})">${u.admin ? "Quitar Admin" : "Hacer Admin"}</button></div></div>`;
    });
    document.getElementById('totalUsuarios').textContent = total;
    document.getElementById('totalVip').textContent = totalVip;
    document.getElementById('totalBaneados').textContent = totalBaneados;
  }catch(e){ console.log(e); }
}
async function darVip(id){ try{ await db.collection('usuarios').doc(id).update({vip:true, vipHasta:0, baneado:false}); alert("VIP dado 👑"); cargarUsuarios(); verTodo(); }catch(e){ alert("Error: "+e.message); } }
async function quitarVip(id){ try{ await db.collection('usuarios').doc(id).update({vip:false, vipHasta:0, admin:false}); alert("VIP quitado ✅"); cargarUsuarios(); verTodo(); }catch(e){ alert("Error: "+e.message); } }
async function banear(id, estaBaneado){ try{ await db.collection('usuarios').doc(id).update({baneado:!estaBaneado, vip: estaBaneado ? true : false, vipHasta:0}); alert(estaBaneado?"Usuario desbaneado ✅":"Usuario baneado 🚫 y sin VIP"); cargarUsuarios(); verTodo(); }catch(e){ alert("Error: "+e.message); } }
async function darDiamantes(id){ try{ let doc = await db.collection('usuarios').doc(id).get(); let d = doc.data(); let nuevo = (d.diamantes||0)+100; await db.collection('usuarios').doc(id).update({diamantes:nuevo}); alert("+100 diamantes dados 💎"); cargarUsuarios(); }catch(e){ alert("Error: "+e.message); } }
async function hacerAdmin(id, esAdmin){ try{ await db.collection('usuarios').doc(id).update({admin:!esAdmin}); alert(esAdmin?"Admin quitado":"Ahora es Admin 🛡️"); cargarUsuarios(); }catch(e){ alert("Error: "+e.message); } }
async function verTodo(){ if(!userActual) return; let doc = await db.collection('usuarios').doc(userActual.uid).get(); if(doc.exists){ datosActual = doc.data(); actualizarUI(); } cargarMods(); }
function cargarMods(){ document.getElementById('listaMods').innerHTML = `<div class="user-card"><b>🔥 AKIM MOD MENU</b><br><small>Última versión</small><br><br><button class="btn-blue" onclick="descargarGratis()">Descargar</button></div><div class="user-card"><b>💎 AKIM VIP PACK</b><br><small>Solo VIP</small><br><br><button class="btn-gold" onclick="descargarVip()">Descargar VIP</button></div>`; }
auth.onAuthStateChanged(async (user)=>{
  if(user){
    userActual = user;
    let doc = await db.collection('usuarios').doc(user.uid).get();
    if(doc.exists){
      datosActual = doc.data();
      if(datosActual.baneado){ alert("🚫 Estás baneado, no puedes entrar a la web"); await auth.signOut(); return; }
      document.getElementById('authBox').classList.add('hidden');
      document.getElementById('userBox').classList.remove('hidden');
      actualizarUI(); cargarMods();
    } else {
      await db.collection('usuarios').doc(user.uid).set({nombre:user.email.split('@')[0], email:user.email, vip:false, vipHasta:0, admin:false, baneado:false, diamantes:0, fecha:Date.now()});
      location.reload();
    }
  } else {
    userActual = null;
    document.getElementById('authBox').classList.remove('hidden');
    document.getElementById('userBox').classList.add('hidden');
    document.getElementById('adminBox').classList.add('hidden');
    cargarMods();
  }
});
setInterval(async ()=>{
  if(userActual){
    try{
      let doc = await db.collection('usuarios').doc(userActual.uid).get();
      if(doc.exists){ datosActual = doc.data(); if(doc.data().baneado){ alert("🚫 Fuiste baneado por el moderador"); await auth.signOut(); location.reload(); return; } esVipActivo(); actualizarUI(); }
    }catch(e){}
  }
}, 10000);
cargarMods();
</script>
</body>
</html>
